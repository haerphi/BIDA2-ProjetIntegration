version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bida2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tennis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5    

  api:
    build:
      context: ./BIDA2-ProjetIntegration-API
      dockerfile: docker/Dockerfile
    container_name: bida2_api
    restart: unless-stopped
    environment:
      DEBUG: "True"
      SECRET_KEY: "votre_cle_secrete_ultra_secure"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/tennis_db"
    ports:
      - "8000:8000"
    volumes:
      - ./BIDA2-ProjetIntegration-API:/app
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./BIDA2-ProjetIntegration-Client
      dockerfile: docker/Dockerfile
    container_name: bida2_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./BIDA2-ProjetIntegration-Client:/app
      - client_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - api

volumes:
  postgres_data:
  client_node_modules:
